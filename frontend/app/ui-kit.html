<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UI 组件库 · 灵犀工作坊</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/zcode-tokens.css" />
    <link rel="stylesheet" href="/zcode.css" />
    <link rel="stylesheet" href="/control-center.css" />
    <link rel="stylesheet" href="/usage-stable.css" />
    <link rel="stylesheet" href="/reactbits/workbench-react.css" />
    <link rel="stylesheet" href="/admin-interactions.css" />
    <link rel="stylesheet" href="/ui-system.css" />
    <link rel="stylesheet" href="/usage-v23.css" />
    <link rel="stylesheet" href="/usage-v24.css" />
    <link rel="stylesheet" href="/shell-experience.css" />
    <link rel="stylesheet" href="/onboarding.css" />
    <style>
      body {
        overflow: auto;
      }
      .wb-standalone h1 {
        margin: 0 0 8px;
      }
      .wb-story-stage .control-field {
        min-width: 180px;
      }
      .wb-story-stage .usage-pie-layout {
        width: 100%;
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 20px;
      }
      .wb-story-stage .usage-legend {
        max-height: 250px;
        overflow: auto;
      }
      .wb-token-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .wb-token-swatches > div {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        min-width: 120px;
      }
      .wb-token-swatches i {
        display: block;
        height: 32px;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .wb-contract {
        font:
          12px/1.7 ui-monospace,
          monospace;
        white-space: pre-wrap;
        color: var(--ink-2);
      }
      @media (max-width: 700px) {
        .wb-story-stage .usage-pie-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-page="ui-kit">
    <main class="wb-standalone">
      <header class="wb-standalone-header">
        <div>
          <h1>灵犀 UI 组件库</h1>
          <p class="wb-muted">
            应用内部设计与交互契约 · 0.0.32 · 实际业务组件与演示状态
          </p>
        </div>
        <div class="control-actions">
          <span data-kit-theme></span
          ><a href="/index.html#/settings/data">返回工作台</a>
        </div>
      </header>
      <div data-standalone-body></div>
    </main>
    <script src="/reactbits/workbench.js"></script>
    <script type="module" src="/standalone.tsx"></script>
  </body>
</html>
