<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" fill="none" class="lingxi-mark" data-brand-motion="portal" style="width:512px;height:512px;color:#3976f6;--surface:#fff" role="img" aria-label="H · 双弧之门"><title>H · 双弧之门</title><style>/* Lingxi: the original connecting arcs, calm surfaces and clear hierarchy. */
@font-face{font-family:"Lingxi Brush";src:url("assets/fonts/LingxiBrush.woff2") format("woff2");font-display:swap}
.lingxi-mark{display:inline-grid;place-items:center;width:56px;height:56px;flex:none;color:#3976f6}
.lingxi-mark svg{width:100%;height:100%;overflow:visible;display:block}
.lingxi-mark--large{width:clamp(140px,20vw,260px);height:auto;aspect-ratio:1}
.lingxi-mark .lingxi-arc{stroke:currentColor;stroke-width:10;stroke-linecap:round}
.lingxi-mark-eye{fill:var(--surface,#fff)}
.lingxi-orbit{stroke:currentColor;stroke-width:1.3;stroke-dasharray:14 86;opacity:0;transform-origin:60px 60px}
[data-brand-motion=breath] .lingxi-mark-body{transform-origin:60px 60px;animation:lingxi-breathe 2.4s ease-in-out infinite}
[data-brand-motion=trace] .lingxi-arc{animation:lingxi-trace 2.8s ease-in-out infinite}
[data-brand-motion=trace] .lingxi-arc-b{animation-delay:-1.4s}
[data-brand-motion=orbit] .lingxi-orbit{opacity:.45;animation:lingxi-orbit 3s linear infinite}
.lingxi-loader-label{display:block;margin-top:12px;color:var(--ink-2);font-size:12px;text-align:center}
.lingxi-progress{height:6px;min-height:6px!important;position:relative;overflow:hidden;border-radius:999px;background:var(--line,#e3e8ee);width:100%}
.lingxi-progress-fill{display:block;width:100%;height:100%;border-radius:inherit;background:var(--accent,#3976f6);transform-origin:left center;transition:transform 220ms ease}
@keyframes lingxi-breathe{0%,100%{opacity:.65;transform:scale(.965)}50%{opacity:1;transform:scale(1)}}
@keyframes lingxi-trace{0%,100%{stroke-dasharray:75 25;stroke-dashoffset:0;opacity:.55}50%{stroke-dasharray:100 0;stroke-dashoffset:-100;opacity:1}}
@keyframes lingxi-orbit{to{transform:rotate(360deg)}}
.preview-brand span,.brand-lockup{font-family:"Lingxi Brush",serif;font-weight:400}
.brand-lockup{font-size:clamp(28px,3vw,42px);letter-spacing:.04em;color:var(--ink)}
.brand-candidate-stage{display:flex;align-items:center;justify-content:center;gap:28px;min-height:210px;background:var(--surface-soft);border-radius:12px;margin-bottom:20px}
.brand-candidate-stage .lingxi-mark--large{width:140px}
.brand-candidate-stage .lingxi-mark--small{width:40px;height:40px}
.brand-candidates h3{margin-bottom:8px}.brand-candidates p{margin-bottom:0}
.brand-visual{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px;min-height:400px;width:100%;border:0;background:transparent;box-shadow:none;overflow:visible}
.brand-visual>*{position:relative}
:root[data-theme=dark] .lingxi-mark{color:#8aafff}
:root[data-motion=reduced] .lingxi-mark *{animation:none!important}
:root[data-motion=reduced] .lingxi-progress-fill{transition:none}
@media(prefers-reduced-motion:reduce){.lingxi-mark *{animation:none!important}.lingxi-progress-fill{transition:none}}
/* Six additional identity studies: always retain the original connecting mark. */
.brand-ripple circle{stroke:currentColor;stroke-width:1;opacity:.2;transform-origin:60px 60px;animation:lingxi-ripple 4.8s ease-out infinite}.brand-ripple circle+circle{animation-delay:-2.4s}
.brand-stars path{stroke:currentColor;stroke-width:.6;opacity:.15}.brand-stars circle{fill:currentColor;opacity:.35;animation:lingxi-star 5.4s ease-in-out infinite}.brand-stars circle:nth-child(3){animation-delay:-.9s}.brand-stars circle:nth-child(4){animation-delay:-1.8s}.brand-stars circle:nth-child(5){animation-delay:-2.7s}.brand-stars circle:nth-child(6){animation-delay:-3.6s}.brand-stars circle:nth-child(7){animation-delay:-4.5s}
.brand-ribbons path{stroke:currentColor;stroke-width:1;opacity:.3;stroke-dasharray:40 60;animation:lingxi-ribbon 5s linear infinite}.brand-ribbons path+path{animation-direction:reverse;animation-delay:-2.5s;opacity:.2}
.brand-beacons path{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;opacity:.25;animation:lingxi-beacon 4s ease-in-out infinite}[data-brand-motion=beacon] .lingxi-mark-body{transform-origin:60px 60px;animation:lingxi-soft-heart 4s ease-in-out infinite}
.brand-portals path{stroke:currentColor;stroke-width:1;opacity:.3;transform-origin:60px 60px;animation:lingxi-portal 5.2s ease-in-out infinite}.brand-portals path+path{animation-delay:-2.6s}
.brand-duet circle{stroke:currentColor;stroke-width:1;stroke-dasharray:12 88;opacity:.4;transform-origin:60px 60px;animation:lingxi-orbit 6s linear infinite}.brand-duet circle+circle{stroke-dasharray:18 82;opacity:.2;animation-direction:reverse;animation-duration:8s}
@keyframes lingxi-ripple{0%{opacity:0;transform:scale(.86)}18%{opacity:.32}100%{opacity:0;transform:scale(1.22)}}
@keyframes lingxi-star{0%,100%{opacity:.2}45%{opacity:.8}}
@keyframes lingxi-ribbon{to{stroke-dashoffset:-100}}
@keyframes lingxi-beacon{0%,100%{opacity:.15}45%{opacity:.6}}
@keyframes lingxi-soft-heart{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.82;transform:scale(.975)}}
@keyframes lingxi-portal{0%,100%{opacity:.2;transform:scaleX(.94)}50%{opacity:.5;transform:scaleX(1.04)}}
.brand-candidate-stage[data-offscreen=true] .lingxi-mark *{animation-play-state:paused!important}
</style><g class="brand-portals"><path pathLength="100" d="M46 9a53 53 0 0 0 0 102"/><path pathLength="100" d="M74 9a53 53 0 0 1 0 102"/></g><g class="lingxi-mark-body"><path class="lingxi-arc lingxi-arc-a" pathLength="100" d="M60 34C41 20 23 37 28 57c3 13 19 19 32 29"/><path class="lingxi-arc lingxi-arc-b" pathLength="100" d="M60 86c19 14 37-3 32-23C89 50 73 44 60 34"/><path d="m46 62 14-14 14 14-14 14Z" fill="currentColor"/><circle cx="60" cy="62" r="5" class="lingxi-mark-eye"/></g></svg>